services:
  mymoney:
    build: .
    image: mymoney:latest
    container_name: mymoney
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:8080"
    environment:
      APP_PASSWORD: ${APP_PASSWORD:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-claude-opus-5-5}
      AI_EFFORT: ${AI_EFFORT:-low}
      AI_VISION_EFFORT: ${AI_VISION_EFFORT:-medium}
      AI_FALLBACKS: ${AI_FALLBACKS:-true}
      TZ: ${TZ:-Asia/Jakarta}
    volumes:
      - mymoney-data:/data

  # Opsional: akses dari mana saja lewat HTTPS dengan Cloudflare Tunnel.
  # Jalankan dengan: docker compose --profile tunnel up -d
  cloudflared:
    image: cloudflare/cloudflared:latest
    profiles: ["tunnel"]
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      - mymoney

volumes:
  mymoney-data:
